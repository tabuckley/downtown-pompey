    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;

        img {

            margin-bottom: 1.6rem;
        }

<body>
