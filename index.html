<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternative Archiving | Downtown Pompey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>
<body class="landing" data-page="landing">

    <header class="landing-topbar">
        <h1 class="sr-only">Downtown Pompey — an alternative archive of Portsmouth city centre</h1>
        <nav class="landing-topbar-nav">
            <a href="editorial.html">Editorial</a>
            <a href="scrapbook.html">Scrapbook</a>
            <a href="accessible.html">Accessible</a>
            <a href="process.html">The Process</a>
        </nav>
    </header>

    <section class="panels" id="explore">

        <!-- Three ways in, just a title + one line of text over a shared
             background scene — the scene IS the design. One real element
             behind all three panels (object-fit:cover, so it crops to
             fill rather than stretching) rather than a separate
             background-image per panel, so it reads as one continuous
             scene regardless of how the panels themselves reflow at
             narrower widths. -->
        <video class="panels-bg" src="images/panels-bg.mp4" autoplay muted loop playsinline></video>

        <!-- Object-glow test: a soft highlight over each object in the
             video, sized/positioned identically to .panels-bg (fixed,
             inset:0, object-fit:cover) so each one tracks the same
             object-fit cropping math and stays pixel-aligned with its
             object at every viewport size without any JS — only opacity
             is toggled (see panel-glow.js), on hover/focus of the panel
             that points at it. -->
        <img class="object-glow" data-glow="scrapbook" src="images/glow-notebook.png" alt="">
        <img class="object-glow" data-glow="web00" src="images/glow-pc.png" alt="">
        <img class="object-glow" data-glow="accessible" src="images/glow-pillar.png" alt="">

        <!-- Elbow connector overlay: one <path> per glow target, drawn by
             panel-glow.js between the triggering panel's title and the
             glow's fixed point in the video frame. Needs JS (not pure
             CSS) because the panel's on-screen position reflows across
             breakpoints while the target point is anchored to the video. -->
        <svg class="connector-overlay" aria-hidden="true">
            <path class="connector-line" data-connector="scrapbook"></path>
            <circle class="connector-dot" data-connector="scrapbook" r="4"></circle>
            <path class="connector-line" data-connector="web00"></path>
            <circle class="connector-dot" data-connector="web00" r="4"></circle>
            <path class="connector-line" data-connector="accessible"></path>
            <circle class="connector-dot" data-connector="accessible" r="4"></circle>
        </svg>

        <!-- The video itself has a neon "Downtown Pompey" sign on the
             left wall — this sits underneath it as a welcome line,
             positioned to roughly match that fixed point in the frame
             (see .welcome-copy in styles.css for the same caveat as
             .vhs-logo: a plain percentage position within .panels, not
             the pixel-exact object-fit-cover math panel-glow.js does
             for the badges, so it can drift slightly at extreme
             viewport ratios). -->
        <div class="welcome-copy">
            <p class="welcome-copy-text">An alternative archive of Portsmouth kept alive by the people who live it.</p>
            <a href="process.html" class="welcome-copy-link">
                <img src="images/aag-process-badge.png" alt="" width="40" height="40">
                <span>See how the site was made</span>
            </a>
        </div>

        <!-- A flex row instead of each badge scattered individually —
             centres all three as one group near the top rather than
             needing per-badge translateX math to line them up. -->
        <div class="badge-row">
            <a href="scrapbook.html" class="badge badge--scrapbook" data-glow-target="scrapbook" data-glow-x="0.536" data-glow-y="0.587">
                <span class="badge-title">Scrapbook</span>
                <span class="badge-copy">Pinned up &amp; tagged</span>
            </a>

            <a href="editorial.html" class="badge badge--web00" data-glow-target="web00" data-glow-x="0.448" data-glow-y="0.467">
                <span class="badge-title">00s Web</span>
                <span class="badge-copy">Step into the room</span>
            </a>

            <a href="accessible.html" class="badge badge--accessible" data-glow-target="accessible" data-glow-x="0.587" data-glow-y="0.530">
                <span class="badge-title">Accessible</span>
                <span class="badge-copy">Plain-text way in</span>
            </a>
        </div>

    </section>

    <footer class="landing-footer">
        <div class="logo-strip">
            <a href="https://downtownpompey.com/" target="_blank" rel="noopener" class="logo-strip-item">
                <img src="https://media.downtownpompey.online/Downtown-Pompey-logo.png" alt="Downtown Pompey">
            </a>
            <a href="https://www.heritagefund.org.uk/" target="_blank" rel="noopener" class="logo-strip-item">
                <img src="images/logo-heritage-fund.png" alt="Made possible with Heritage Fund">
            </a>
            <a href="https://www.play-office.com/" target="_blank" rel="noopener" class="logo-strip-item">
                <img src="images/logo-play-office.gif" alt="Play Office">
            </a>
        </div>
    </footer>

    <div id="site-helper"></div>
    <script type="module" src="helper.js"></script>
    <script type="module" src="panel-glow.js"></script>
</body>
</html>
