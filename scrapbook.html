<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collected | Alternative Archiving</title>
    <meta name="description" content="Browse the Downtown Pompey archive as an infinite, tag-filtered scrapbook — photos, flyers, zines and more from Portsmouth's city centre.">
    <link rel="canonical" href="https://downtownpompey.online/scrapbook.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Downtown Pompey">
    <meta property="og:title" content="Collected | Alternative Archiving">
    <meta property="og:description" content="Browse the Downtown Pompey archive as an infinite, tag-filtered scrapbook — photos, flyers, zines and more.">
    <meta property="og:url" content="https://downtownpompey.online/scrapbook.html">
    <meta property="og:image" content="https://media.downtownpompey.online/Downtown-Pompey-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Collected | Alternative Archiving">
    <meta name="twitter:description" content="Browse the Downtown Pompey archive as an infinite, tag-filtered scrapbook — photos, flyers, zines and more.">
    <meta name="twitter:image" content="https://media.downtownpompey.online/Downtown-Pompey-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>
<body data-mode="scrapbook" data-page="scrapbook">

    <h1 class="sr-only">Collected — an infinite, tag-filtered scrapbook of the Downtown Pompey archive</h1>

    <header class="page-topbar">
        <a href="index.html" class="home-link">
            <img src="https://media.downtownpompey.online/Downtown-Pompey-logo.png" alt="Downtown Pompey — Alternative Archiving" class="home-logo">
        </a>
        <nav class="mode-switcher">
            <a href="editorial.html" class="mode-btn">Curated</a>
            <a href="scrapbook.html" class="mode-btn active">Collected</a>
            <a href="accessible.html" class="mode-btn">Credited</a>
        </nav>
    </header>

    <div class="filter-bar-bottom">
        <div class="tag-bar" id="tagBar">
            <details class="room-items-toggle" id="scrapItemsToggle">
                <summary>Browse items as a list</summary>
                <ul id="scrapItemsList"></ul>
            </details>
        </div>
        <div class="filter-meta">
            <button class="clear-filters" id="clearFilters">clear filters</button>
        </div>
    </div>

    <div class="pan-canvas" id="panCanvas" aria-hidden="true"></div>
    <p class="grid-status" id="gridStatus"></p>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Archive item viewer">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
        <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous">&#8592;</button>
        <button class="lightbox-next" id="lightboxNext" aria-label="Next">&#8594;</button>
        <div class="lightbox-media" id="lightboxMedia"></div>
        <aside class="lightbox-info" id="lightboxInfo"></aside>
    </div>

    <div id="site-helper"></div>
    <script type="module" src="helper.js"></script>
    <script type="module" src="scrapbook.js"></script>
</body>
</html>
